# ============================================================================
#  NullGate WAF — Configuration
#  Every field below has a safe built-in default; you only need to override
#  what differs for your deployment. Run `nullgate --show-config` to see the
#  effective values after defaults and clamping are applied.
# ============================================================================

server:
  listen_addr: ":8080"              # where the WAF accepts public traffic
  target_backend: "http://127.0.0.1:3000"   # your real application (change this)
  enable_tls: false
  tls_cert: ""
  tls_key: ""
  read_timeout_sec: 15
  read_header_timeout_sec: 5
  write_timeout_sec: 15
  idle_timeout_sec: 60
  max_header_bytes: 1048576         # 1 MiB
  # IPs/CIDRs of upstream load balancers whose X-Forwarded-For we trust.
  # Leave empty if the WAF is directly internet-facing.
  trusted_proxies: []

# ------------------------------ Applications -------------------------------
applications:
  registry_path: "data/apps.json"   # separate, atomically-written persistent app registry
  # Additional upstream authorities must be explicitly trusted here.
  # Entries may be hostnames (standard ports only) or exact host:port values.
  # The configured server.target_backend authority is trusted automatically.
  allowed_upstream_hosts: []

showcase:
  database_path: "data/showcase.db"

# ------------------------------ Protocol hygiene ---------------------------
protocol:
  max_url_length: 8192
  max_header_count: 60
  max_query_params: 128
  max_method_length: 16
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
  strict_version_check: true
  enforce_content_type: true
  reject_chunked_bodies: false
  reject_content_length_mismatch: true     # anti request-smuggling
  reject_conflicting_encoding: true        # anti request-smuggling
  block_null_bytes: true
  block_control_chars: true
  max_request_size: 33554432               # 32 MiB
  max_allowed_content_types:
    - "application/x-www-form-urlencoded"
    - "multipart/form-data"
    - "application/json"
    - "text/plain"
    - "application/xml"
    - "text/xml"
    - "application/octet-stream"

# ------------------------------ Detection rules ----------------------------
rules:
  paranoia_level: 2          # 1 (fewest FPs) .. 4 (most aggressive)
  anomaly_threshold: 8       # cumulative medium/low score that triggers a block
  block_on_critical: true    # any single critical rule blocks immediately
  rule_actions:              # per-severity policy; critical/high are decisive
    critical: block
    high: block
    medium: log              # medium/low accumulate toward anomaly_threshold
    low: log

# ------------------------------ Payload decoding ---------------------------
decoding:
  max_decode_depth: 5        # bounded to defeat decode-bomb DoS
  max_payload_size: 10485760 # 10 MiB scanned per request
  max_request_size: 33554432 # 32 MiB read ceiling
  enable_gzip_scan: true
  enable_deflate_scan: true
  enable_brotli_scan: false
  enable_json_scan: true
  enable_multipart_scan: true
  enable_base64_scan: true
  enable_hex_scan: true
  enable_unicode_scan: true
  enable_comment_scan: true
  enable_whitespace_scan: true

# ------------------------------ Rate limiting ------------------------------
rate_limit:
  enabled: true
  requests_per_second: 20
  burst_size: 60
  escalation_after: 20       # violations before a PoW challenge is required
  block_after: 40            # violations before a hard block
  block_duration_sec: 300
  cleanup_interval_sec: 60
  per_ip: true
  per_route: false

# ------------------------------ Proof-of-Work ------------------------------
pow:
  enabled: false             # enable under attack; requires a real hmac_secret
  difficulty: 4              # leading zero bits required in SHA-256
  challenge_ttl: 300
  # MUST be replaced with a strong random value before enabling in production.
  # Generate one with:  nullgate --gen-secret
  hmac_secret: "change-me-in-production"

# ------------------------------ Bot mitigation -----------------------------
bot:
  enabled: true
  block_known_bots: true     # blocks sqlmap/nikto/curl/python-requests/etc.
  require_sec_fetch: false
  block_empty_ua: true

# ------------------------------ Behavioral analysis ------------------------
behavior:
  enabled: true
  max_path_depth: 12
  max_extensions_in_path: 8
  consecutive_block_threshold: 5   # blocks in a row → shared blocklist
  cooldown_sec: 600
  track_empty_ua: true
  track_suspicious_ua: true
  track_methods: true
  block_scanner_probe: true
  scanner_block_sec: 3600

# ------------------------------ CSRF ---------------------------------------
csrf:
  enabled: true
  token_ttl_min: 30
  exclude_paths: ["/healthz", "/metrics"]
  exclude_methods: ["GET", "HEAD", "OPTIONS"]

# ------------------------------ Response hardening -------------------------
response:
  enabled: true
  add_security_headers: true
  strip_server_header: true
  strip_x_powered_by: true
  add_csp: true
  add_hsts: false            # enable only when serving over HTTPS end-to-end
  redact_cookies: true
  redact_headers: ["authorization", "x-api-key", "proxy-authorization", "cookie"]

# ------------------------------ Honeypot -----------------------------------
honeypot:
  enabled: true
  block_duration_sec: 3600
  log_only: false
  probe_paths:
    - "/wp-login.php"
    - "/wp-admin"
    - "/.env"
    - "/.git/config"
    - "/phpinfo.php"
    - "/server-status"
    - "/actuator"
    - "/console"
    - "/cgi-bin/"
    - "/shell.php"
    - "/admin.php"

# ------------------------------ Tarpit -------------------------------------
tarpit:
  enabled: true
  min_delay_ms: 1000
  max_delay_ms: 30000
  step_ms: 2000
  request_count_threshold: 100
  window_sec: 10

# ------------------------------ Admin dashboard ----------------------------
admin:
  enabled: false             # enable only after setting a strong password hash
  listen_addr: "127.0.0.1:9091"
  username: "admin"
  password_hash: ""          # set a strong hash before enabling write controls
  read_only: true
  require_localhost: true

# ------------------------------ Metrics ------------------------------------
metrics:
  enabled: true
  path: "/metrics"           # Prometheus text format
  prometheus_format: true

# ------------------------------ Logging ------------------------------------
logging:
  level: "info"              # debug | info | warn | error
  format: "json"             # json | text
  output: "stdout"           # stdout | file
  file_path: "logs/waf.log"
  max_size_mb: 100
  max_backups: 7
  max_age_days: 30
  enable_access_log: true
  access_log_target: "stdout"

# ------------------------------ Client IP resolution -----------------------
ip:
  trusted_proxies: []
  trust_x_forwarded_for: false   # only enable behind a trusted proxy
  trust_x_real_ip: false
  max_forwarded_chain: 5
  enable_geolocation: false
