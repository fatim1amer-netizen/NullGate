app = "nullgate-waf"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NULLGATE_CONFIG = "/configs/graduation-platform.yaml"
  TARGET_BACKEND = "https://7a08f55f.graduation-platform-2026.pages.dev"
  UPSTREAM_HOST = "7a08f55f.graduation-platform-2026.pages.dev"

[checks]
  [checks.healthz]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    port = 8080
    timeout = "5s"
    type = "http"
