# ── NullGate WAF — full demo stack ───────────────────────────────────────────
# `docker compose up` brings up the WAF in front of a deliberately-vulnerable
# demo backend so you can watch NullGate block real attacks end-to-end.
#
#   WAF        →  http://localhost:8080   (public, protected entry point)
#   metrics    →  http://localhost:8080/metrics
#   admin      → disabled in the container by default
#   backend    →  internal only (never exposed directly)

services:
  waf:
    build:
      context: .
      args:
        VERSION: "2.0.0"
    image: nullgate:2.0.0
    container_name: nullgate-waf
    restart: unless-stopped
    ports:
      - "8080:8080"   # public traffic + /metrics
    volumes:
      - ./configs/config.yaml:/configs/config.yaml:ro
    environment:
      # The demo config points the backend at the compose service name.
      - TARGET_BACKEND=http://backend:3000
    depends_on:
      - backend
    networks:
      - edge
      - internal
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/nullgate", "--version"]
      interval: 30s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: examples/vulnerable-backend/Dockerfile
    image: nullgate-demo-backend:latest
    container_name: nullgate-backend
    restart: unless-stopped
    # NOT published to the host: reachable only through the WAF.
    expose:
      - "3000"
    networks:
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
