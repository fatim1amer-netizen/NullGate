# ── NullGate WAF — full demo stack ───────────────────────────────────────────
# `docker compose up` starts two in-process synthetic apps behind the WAF.
# No vulnerable backend listener is created or published.
#
#   WAF        →  http://127.0.0.1:8080   (loopback-only demo entry point)
#   metrics    →  http://localhost:8080/metrics
#   admin      →  disabled unless explicitly configured with authentication

services:
  waf:
    build:
      context: .
      args:
        VERSION: "2.0.0"
    image: nullgate:2.0.0
    container_name: nullgate-waf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # keep intentionally weak synthetic demos local
    volumes:
      - ./configs/config.yaml:/configs/config.yaml:ro
      - nullgate-data:/data
    command: ["--config", "/configs/config.yaml", "--app-registry", "/data/apps.json", "--demo"]
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/nullgate", "--version"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  edge:
    driver: bridge

volumes:
  nullgate-data:
