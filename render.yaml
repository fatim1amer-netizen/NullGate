services:
  - type: web
    name: nullgate-waf
    runtime: docker
    branch: fatim1amer-netizen-nullgate-false-positive-fixes
    repo: https://github.com/fatim1amer-netizen/NullGate
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NULLGATE_CONFIG
        value: /configs/graduation-platform.yaml
      - key: TARGET_BACKEND
        value: https://7a08f55f.graduation-platform-2026.pages.dev
      - key: UPSTREAM_HOST
        value: 7a08f55f.graduation-platform-2026.pages.dev
    healthCheckPath: /healthz
