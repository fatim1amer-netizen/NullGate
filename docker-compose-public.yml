version: '3.8'

services:
  # NullGate WAF
  waf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nullgate-waf
    restart: unless-stopped
    ports:
      - "8080:8080"   # Public proxy
    networks:
      - nullgate-internal
    volumes:
      - ./configs/graduation-platform.yaml:/configs/config.yaml:ro
    command: ["--config", "/configs/config.yaml"]
    healthcheck:
      test: ["CMD", "/nullgate", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Publicly expose the real Graduation Platform through the WAF, not admin.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nullgate-tunnel
    restart: unless-stopped
    networks:
      - nullgate-internal
    depends_on:
      - waf
    command: tunnel --no-autoupdate --url http://waf:8080
    environment:
      - TUNNEL_METRICS=0.0.0.0:9099

networks:
  nullgate-internal:
    driver: bridge

# Usage:
# 1. docker-compose -f docker-compose-public.yml up -d
# 2. docker-compose -f docker-compose-public.yml logs tunnel
# 3. Look for the public URL: https://xxxxx.trycloudflare.com
# 4. The public URL serves the Graduation Platform through the WAF.
# 5. The admin socket is not published or tunneled.
