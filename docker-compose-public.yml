version: '3.8'

services:
  # NullGate WAF
  waf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nullgate-waf
    restart: unless-stopped
    ports:
      - "8080:8080"   # Public proxy
    networks:
      - nullgate-internal
    volumes:
      - ./configs:/app/configs:ro
      - nullgate-data:/data
    command: ["--config", "/app/configs/config.yaml", "--app-registry", "/data/apps.json"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare Tunnel exposes only the protected WAF listener, never the admin
  # interface or a backend directly.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nullgate-tunnel
    restart: unless-stopped
    networks:
      - nullgate-internal
    depends_on:
      - waf
    command: tunnel --no-autoupdate --url http://waf:8080
    environment:
      - TUNNEL_METRICS=0.0.0.0:9099

networks:
  nullgate-internal:
    driver: bridge

volumes:
  nullgate-data:

# Usage:
# 1. docker-compose -f docker-compose-public.yml up -d
# 2. docker-compose -f docker-compose-public.yml logs tunnel
# 3. Look for the public URL: https://xxxxx.trycloudflare.com
# 4. Configure server.target_backend in configs/config.yaml to your trusted app.
#    Do not use the intentionally vulnerable example backend in a public deployment.
